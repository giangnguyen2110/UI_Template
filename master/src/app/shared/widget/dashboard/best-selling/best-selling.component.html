<table class="table table-hover table-centered align-middle table-nowrap mb-0">
    <thead class="table-light fs-12 text-muted">
        <tr>
            <th>Tên Đề Tài & Thời Gian</th>
            <th>Kinh Phí Cấp</th>
            <th>Chủ Nhiệm Đề Tài</th>
            <th>Khoa / Đơn Vị</th>
            <th>Trạng Thái</th>
        </tr>
    </thead>
    <tbody>
        @for (data of BestSelling; track $index) {
        <tr>
            <td>
                <div class="d-flex align-items-center">
                    <div class="avatar-sm bg-light rounded p-1 me-2 flex-shrink-0">
                        <img src="{{data.image}}" alt="" class="img-fluid d-block rounded" />
                    </div>
                    <div>
                        <h5 class="fs-13 my-1 fw-semibold text-truncate" style="max-width: 220px;">
                            <a routerLink="/nckh/de-tai-cua-toi" class="text-reset" [title]="data.pName">{{data.pName}}</a>
                        </h5>
                        <span class="text-muted fs-11"><i class="ri-calendar-line me-1"></i>{{data.date}}</span>
                    </div>
                </div>
            </td>
            <td>
                <h5 class="fs-13 my-1 fw-medium text-primary">{{data.price}}</h5>
                <span class="text-muted fs-11">Kinh phí đề xuất</span>
            </td>
            <td>
                <h5 class="fs-13 my-1 fw-normal text-dark">{{data.orders}}</h5>
                <span class="text-muted fs-11">Chủ nhiệm đề tài</span>
            </td>
            <td>
                <span class="badge bg-primary-subtle text-primary fs-11">{{data.stock}}</span>
            </td>
            <td>
                <span class="badge bg-success-subtle text-success fs-11">{{data.amount}}</span>
            </td>
        </tr>
        }
    </tbody>
</table>
